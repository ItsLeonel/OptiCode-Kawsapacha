name: Frontend V1 - Validación
on:
  push:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund
      - name: Verificar TypeScript
        run: npm run typecheck
      - name: Compilar
        run: npm run build
      - name: Pruebas unitarias de dominio
        run: npm run test:unit
      - name: Instalar navegador para pruebas del jardín
        run: npx playwright install --with-deps chrome
      - name: Prueba de render regional y características
        run: npx playwright test --config playwright.garden-poc.config.ts tests/garden-poc-regions-render.spec.ts tests/garden-poc-art.spec.ts
      - name: Suite completa del jardín (Playwright)
        run: npm run test:garden-poc -- --reporter=line --max-failures=4
      - name: Guardar evidencias Playwright si fallan las pruebas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kawsapacha-playwright-fallos
          path: frontend/test-results/garden-poc
          if-no-files-found: ignore
